
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050912">
  <title>J.A.R.B.A.S.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #142b42, #050912 65%);
      color: #e8f7ff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { width: 100%; max-width: 440px; text-align: center; }
    .orb {
      width: 150px;
      height: 150px;
      margin: 30px auto;
      border: 2px solid #66d9ff;
      border-radius: 50%;
      box-shadow: 0 0 25px #168dca, inset 0 0 25px #168dca;
      display: grid;
      place-items: center;
      color: #9ceaff;
      font-size: 42px;
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      50% { box-shadow: 0 0 45px #168dca, inset 0 0 35px #168dca; }
    }
    h1 { letter-spacing: 5px; font-size: 28px; }
    .subtitle { color: #8baabd; letter-spacing: 2px; }
    .panel {
      margin-top: 28px;
      padding: 20px;
      border: 1px solid #24516a;
      border-radius: 16px;
      background: #0b1725cc;
      text-align: left;
      line-height: 1.8;
    }
    .status { color: #72e6b0; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 1px solid #66d9ff;
      border-radius: 12px;
      background: #102c40;
      color: #e8f7ff;
      font-size: 16px;
      font-weight: 600;
    }
    button:active { background: #1b4964; }
    #resposta {
      margin-top: 18px;
      min-height: 48px;
      color: #9ceaff;
      line-height: 1.6;
    }
    .small { color: #829bad; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <p class="subtitle">SISTEMA PESSOAL DE ASSISTÊNCIA</p>
    <div class="orb">J</div>
    <h1>J.A.R.B.A.S.</h1>
    <p class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</p>

    <section class="panel">
      <div>▪ Sistema visual: <span class="status">ONLINE</span></div>
      <div>▪ Interface: interativa</div>
      <div>▪ Inteligência artificial: em configuração</div>
      <div>▪ Assistente de voz: próxima etapa</div>
    </section>

    <button onclick="saudar()">INICIAR J.A.R.B.A.S.</button>
    <div id="resposta" aria-live="polite">
      Aguardando seu comando, senhor.
    </div>

    <p class="small">PROJETO PESSOAL · VERSÃO 0.2</p>
  </main>

  <script>
    function saudar() {
      document.getElementById("resposta").textContent =
        "À sua disposição, senhor. Sistemas prontos para a próxima etapa.";
    }
  </script>
</body>
</html>
